[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anywaye-web-fetch"
version = "0.1.0"
description = "Open-source MCP server + CLI to read any web page as clean Markdown for AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AnyWaye", email = "any@anywaye.com" }]
keywords = ["mcp", "web", "fetch", "markdown", "agent", "scraper"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastmcp>=2.0",
  "httpx>=0.27",
  "trafilatura>=1.12",
  "patchright>=1.48",
  "curl_cffi>=0.7",
  "lxml>=5.0",
  "pypdf>=4.0",
  "pydantic>=2.0",
]

[project.scripts]
web-fetch = "app.cli:main"
web-fetch-mcp = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.setuptools.package-data]
app = ["*.json"]
